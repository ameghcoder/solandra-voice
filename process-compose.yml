version: "0.5"

processes:
  server:
    command: pnpm --filter server dev
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8090
        path: /api/demos
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 2
      failure_threshold: 10

  frontend:
    command: pnpm --filter frontend dev
    depends_on:
      server:
        condition: process_healthy
